[project]
name = "aircrafttracker"
version = "0.1.0"
description = "Aircraft tracking project"
authors = [
    {name = "MC"}
]

requires-python = "^3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.3.0,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "types-psycopg2 (>=2.9.21.20260911,<3.0.0.0)"
]

# Настройки покрытия. Исключение базовых классов
[tool.coverage.run]
omit = [
    "src/base_api.py",
    "src/base_file_editor.py",
]
